name: mispisit-antipov

services:
  app:
    image: donjkeeez0r/mispisit-lab1:0.0.6
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16
    profiles: ["tools"]
    environment:
      PGPASSWORD: app
    volumes:
      - ./backup:/backup
    depends_on:
      db:
        condition: service_healthy
    command: pg_dump -h db -U app -d app --clean --if-exists -f /backup/app.sql

  restore:
    image: postgres:16
    profiles: ["tools"]
    environment:
      PGPASSWORD: app
    volumes:
      - ./backup:/backup:ro
    depends_on:
      db:
        condition: service_healthy
    command: psql -v ON_ERROR_STOP=1 -h db -U app -d app -f /backup/app.sql

volumes:
  dbdata: